name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, render, build, preview
    runs-on: macos-15
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      APPETIZE_PUBLIC_KEY: ${{ vars.APPETIZE_PUBLIC_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Test MoeedCore
        run: swift test --package-path Packages/MoeedKit

      - name: Render screens
        run: swift run --package-path Packages/MoeedKit Snapshots "$GITHUB_WORKSPACE/snapshots"

      # The engine reads the sample slide like a real lecture: regions from the PDF's text layer,
      # figures from its ink, and the Set-of-Marks image the model sees.
      - name: Ground the sample slide
        run: swift run --package-path Packages/MoeedKit moeed ground snapshots/sample-slide.pdf 1 snapshots/engine

      # Asking Claude costs a little, so it runs only when started by hand (Actions → CI → Run workflow)
      # and only if the ANTHROPIC_API_KEY secret is set. Each step of its lesson is rendered in the player.
      - name: Explain the sample slide with Claude
        if: github.event_name == 'workflow_dispatch' && env.ANTHROPIC_API_KEY != ''
        continue-on-error: true
        run: |
          swift run --package-path Packages/MoeedKit moeed explain snapshots/sample-slide.pdf 1 snapshots/engine
          swift run --package-path Packages/MoeedKit Snapshots "$GITHUB_WORKSPACE/snapshots/engine" --lesson snapshots/engine/p1-lesson.json

      - name: Upload screens
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: snapshots/

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Build simulator app
        run: |
          xcodebuild build -quiet \
            -project Moeed.xcodeproj -scheme Moeed -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO
          cd build/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/Moeed-simulator.zip" Moeed.app

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Moeed-simulator
          path: Moeed-simulator.zip

      # Interactive preview in the browser. The app is iPad-only, so the link opens an iPad
      # (Appetize defaults to an iPhone, where the app can't run). Needs the APPETIZE_API_TOKEN secret;
      # after the first upload, save the printed key as the APPETIZE_PUBLIC_KEY variable
      # so later builds replace the same app and the link stays the same.
      - name: Send to Appetize
        if: github.ref == 'refs/heads/main' && env.APPETIZE_API_TOKEN != ''
        run: |
          url="https://api.appetize.io/v1/apps"
          if [ -n "$APPETIZE_PUBLIC_KEY" ]; then url="$url/$APPETIZE_PUBLIC_KEY"; fi
          response=$(curl -sS --fail-with-body -X POST "$url" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@Moeed-simulator.zip" -F "platform=ios")
          key=$(printf '%s' "$response" | python3 -c 'import json, sys; print(json.load(sys.stdin)["publicKey"])')
          echo "Appetize public key: $key"
          {
            echo "### Live preview"
            echo "https://appetize.io/embed/$key?device=ipadair4thgeneration&osVersion=17.2&orientation=landscape&autoplay=true"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Swift Playgrounds package
        continue-on-error: true
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pillow
          .venv/bin/python tools/make_playground.py
          cd Build/Moeed.swiftpm
          xcodebuild build -quiet -scheme Moeed -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO

      - name: Upload Playgrounds package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Moeed-swiftpm
          path: Build/Moeed.swiftpm.zip
          if-no-files-found: ignore
